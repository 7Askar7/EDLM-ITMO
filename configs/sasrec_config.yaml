# SASRec Configuration

# Model parameters
model:
  max_len: 200
  hidden_units: 128
  num_blocks: 2
  num_heads: 2
  dropout: 0.2

# Data parameters
data:
  batch_size: 128
  num_workers: 4
  use_real_data: true  # Use real MovieLens dataset
  num_users: 1000  # for synthetic data (not used when use_real_data=true)
  num_items: 500
  avg_seq_len: 50
  min_rating: 4.0  # for MovieLens

# Training parameters
training:
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  use_amp: false
  save_every: 10

# Evaluation parameters
evaluation:
  k: 10
  num_eval_samples: 1000

# Quantization parameters
quantization:
  method: lsq  # none, lsq, pact
  bit_width: 8

# Paths
paths:
  data_dir: ./data/ml-25m  # Changed from ml-1m to ml-25m
  save_dir: ./results/sasrec
